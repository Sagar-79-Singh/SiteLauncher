<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128" fill="none">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0.00" stop-color="#1f9d55"/>
      <stop offset="1.00" stop-color="#0c5c38"/>
    </linearGradient>
    <linearGradient id="sheen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0.00" stop-color="#ffffff" stop-opacity="0.30"/>
      <stop offset="1.00" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="arrow" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0.00" stop-color="#ffffff"/>
      <stop offset="1.00" stop-color="#eafff2"/>
    </linearGradient>
  </defs>

  <!-- rounded square background -->
  <rect x="6" y="6" width="116" height="116" rx="28" fill="url(#bg)"/>

  <!-- subtle top sheen -->
  <rect x="6" y="6" width="116" height="60" rx="28" fill="url(#sheen)"/>

  <!-- launch arrow: shaft + arrowhead -->
  <polygon points="36,84 44,92 68,69 76,52 59,60" fill="url(#arrow)"/>
</svg>
